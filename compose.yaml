# Развёртывание на VPS: сервер комнат + автоматический HTTPS.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d

services:
  yeruverse:
    image: ghcr.io/exryuske/yeruverse:latest
    container_name: yeruverse
    restart: unless-stopped
    environment:
      PORT: 8080
      RUST_LOG: yeruverse=info
      CF_TURN_KEY_ID: ${CF_TURN_KEY_ID:-}
      CF_TURN_API_TOKEN: ${CF_TURN_API_TOKEN:-}
    ports:
      - 127.0.0.1:8080:8080

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [yeruverse]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
