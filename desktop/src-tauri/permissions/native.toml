# Команды приложения доступны с локальной страницы по умолчанию, но окно
# грузится с сервера по https — а для удалённого адреса каждую команду нужно
# разрешить явно, иначе IPC отвечает «not allowed by ACL».

[[permission]]
identifier = "allow-native-api"
description = "Нативные команды YeruVerse: выбор сервера, приём чужого ввода, жизнь комнаты в фоне и звук системы."

[permission.commands]
allow = [
  "capabilities",
  "overlay",
  "set_hotkeys",
  "current_server",
  "set_server",
  "sunshine",
  "sunshine_creds",
  "sunshine_pin",
  "set_control",
  "input_pause",
  "input_move",
  "input_button",
  "input_scroll",
  "input_key",
  "input_release",
  "open_url",
  "set_fullscreen",
  "update_check",
  "update_install",
  "moonlight",
  "set_room",
  "sound_start",
  "sound_stop",
]
deny = []
