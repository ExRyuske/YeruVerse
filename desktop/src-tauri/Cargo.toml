[package]
name = "yeruverse-desktop"
version = "0.1.24"
description = "Screens, voices and keyboards shared straight between people"
repository = "https://github.com/ExRyuske/YeruVerse"
edition = "2021"
default-run = "yeruverse-desktop"

# Собственное рабочее пространство: десктоп тянет пол-экосистемы Tauri, и
# держать его в одном Cargo.lock с лёгким сервером незачем.
[workspace]

[lib]
name = "yeruverse_desktop_lib"
# staticlib/cdylib нужны Android- и iOS-сборкам Tauri.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Оболочка намеренно ничего не знает про сервер комнат: окно всегда смотрит на
# внешний адрес. Благодаря этому в приложение (и особенно в APK) не едут ни
# axum, ни tokio, ни rustls с его сишными потрохами.
[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Открыть ссылку системой. Свой вызов `open`/`xdg-open`/`start` работал везде,
# кроме Android, — а там как раз и открывается ссылка на APK с обновлением.
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Обновление на месте: на Android его нет, там APK ставят руками.
tauri-plugin-updater = "2"

# Системные сочетания существуют не везде. На Android этого плагина просто нет,
# и сборка падала на его импорте. На Linux он есть, но держится на X11: внутри
# у него `global-hotkey`, а тот зовёт XGrabKey через x11rb. Под Wayland забрать
# клавишу у всей системы нельзя в принципе — это решает композитор, и просят
# его об этом порталом (`org.freedesktop.portal.GlobalShortcuts`), которого
# плагин не знает. Оставить плагин значило бы тянуть X11 в дерево ради кода,
# который на Wayland молча ничего не делает; после этой строки x11rb из дерева
# уходит совсем.
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_os = "linux")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# Инжект ввода: простое управление чужим рабочим столом из браузера. Там, где
# он устроен системой, а не протоколом, — набор по умолчанию; Linux объявлен
# отдельно ниже. Одной строкой на все системы нельзя: фичи из разных секций
# Cargo складывает, и выключенный на Linux `x11rb` вернулся бы через заднюю
# дверь, сколько его оттуда ни выключай.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
enigo = "0.6"

# Слежение за клавиатурой вместо захвата клавиш у системы (см. `keys.rs`).
# Обе библиотеки и так есть в дереве — их тянет enigo, — но зависеть на них
# вслепую нельзя: пропадут у него, пропадут и у нас.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }

# Захват звука системы (см. `sysaudio`). Вебвью на Linux — это WebKitGTK, и
# системный звук в `getDisplayMedia` он не отдаёт: просьба `systemAudio` там
# не делает ничего, ровно как на macOS.
#
# Берём его через клиентскую часть PulseAudio, а не через родной API PipeWire.
# Причина одна и практическая: у «простого» API Pulse вся работа — соединиться
# и читать, тогда как pw_stream требует своего цикла событий и согласования
# формата через SPA-поды. На CachyOS (и на любой живой системе с PipeWire)
# слой совместимости `pipewire-pulse` стоит по умолчанию и отдаёт мониторы
# как свои, так что этим же кодом снимается звук и там, и на старом
# PulseAudio.
#
# Ввод — под Wayland и только под Wayland. `default-features = false` выключает
# единственную включённую по умолчанию возможность enigo — `x11rb`, то есть
# весь путь через X11. Вместо неё две дороги, и обе нужны, потому что ни одна
# не покрывает все композиторы:
#
#   `libei_tokio` — через портал рабочего стола (RemoteDesktop -> ConnectToEIS).
#     Санкционированный путь: композитор спрашивает разрешение у человека, как
#     на демонстрацию экрана. Так устроены GNOME 46+ и Plasma 6.1+. tokio,
#     а не smol: асинхронный исполнитель у нас уже есть — его приносит сам
#     Tauri, — и второй в одном процессе не нужен никому.
#
#   `wayland` — напрямую протоколами wlroots (virtual_pointer, virtual_keyboard).
#     Портала не требуют, но реализуют их только композиторы на wlroots: Sway,
#     Hyprland и родня. KWin и Mutter — нет.
#
# Порядок выбора внутри enigo 0.6 — сперва libei, потом wayland: сначала
# спрашиваем портал, а на wlroots-композиторах без портала падаем на прямые
# протоколы. Обе дороги у enigo помечены experimental, и это не оговорка для
# красоты — см. README проекта.
[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2"
libpulse-simple-binding = "2"
enigo = { version = "0.6", default-features = false, features = [
  "libei_tokio",
  "wayland",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
# Захват звука системы (см. `sysaudio`). Своего пути к нему у вебвью на macOS
# нет ни одного: `systemAudio: 'include'` там не работает ни в WebKit, ни в
# Chrome, и трансляция уходит немой.
#
# Фичи перечислены поимённо: у этих крейтов почти всё под своим флагом, и без
# них компилируется пустой модуль, а ошибка выглядит как «нет такого метода».
#
# Везде `default-features = false`: набор по умолчанию тянет привязки ко всему
# фреймворку разом. У ScreenCaptureKit в нём лежит AVFoundation — шестьдесят
# тысяч строк сгенерированного кода, из которого мы не зовём ни строчки.
# На время сборки это влияет мало (замерено: секунда с небольшим из пятнадцати),
# но и держать их незачем — в дерево они больше не попадают. Перечислено ровно
# то, что зовётся из `sysaudio`.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-audio-types = { version = "0.3", default-features = false, features = [
  "std",
  "objc2",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
  "std",
  "objc2",
  "CMBase",
  "CMTime",
  "CMSampleBuffer",
  "CMBlockBuffer",
  "objc2-core-audio-types",
] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
  "std",
  "SCStream",
  "SCShareableContent",
  "SCError",
  "objc2-core-media",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "dispatch2",
  "block2",
] }
block2 = "0.6"
dispatch2 = "0.3"

# Вызов метода у активности Android: сказать оболочке, что мы в комнате.
# Версия обязана совпадать с той, на которой собран сам Tauri, — иначе `JValue`
# из нашего дерева и `JValue`, которого ждёт `JniHandle`, окажутся разными
# типами, и это выяснится только при сборке под Android.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# Оболочка почти ничего не считает: вся работа идёт в вебвью и в сервере.
# Поэтому здесь важнее время сборки, чем последний процент скорости — тонкая
# LTO и параллельная кодогенерация вместо полной LTO в один поток. Для Android
# это особенно заметно: там всё собирается заново под каждую архитектуру.
[profile.release]
lto = "thin"
codegen-units = 16
strip = true

# Отладочная сборка приложения: отлаживать тут нечего — интересный код живёт в
# JS и в крейте сервера, — поэтому отладочную информацию не генерируем вовсе,
# а зависимости собираем оптимизированно один раз.
[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2
debug = false
