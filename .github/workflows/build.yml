name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  # Фильтр по путям только здесь: у push он распространился бы и на теги, а
  # релиз, тихо не собравшийся из-за правки в документации, — худший из миров.
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

# Пока идёт сборка, в ветку успевают дослать ещё коммит — старый прогон уже
# никому не нужен. Релизные теги дорабатывают до конца.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # Отладочная информация в CI не нужна никому, а линковка с ней заметно дольше.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  server:
    name: сервер + образ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # Отдельной релизной сборки здесь нет: её делает образ ниже, а clippy
      # проверяет то же самое дерево быстрее и с предупреждениями как ошибками.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    name: приложение (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Каждая система собирается под свою архитектуру, без явного --target:
        # раннер macOS и так на Apple Silicon. Универсальный пакет компилировал
        # всё дважды — вдвое дольше ради машин, которых Apple не продаёт с 2020
        # года; Intel-маки остаются на ручной сборке.
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Готовый бинарник вместо `cargo install`: тот собирал CLI из исходников
      # по несколько минут в каждой задаче.
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y tauri-cli@^2

      - name: сборка установщика
        working-directory: desktop/src-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          # Ключ подписи есть не всегда: в форках секреты недоступны. Без него
          # собираем без пакетов обновления — иначе Tauri останавливает сборку,
          # ведь публичный ключ в конфигурации есть, а приватного нет.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::нет TAURI_SIGNING_PRIVATE_KEY — собираем без пакетов обновления"
            cargo tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
            exit 0
          fi

          # Ключ — одна строка base64. Перенос строки или пробел, попавшие при
          # копировании, ломают разбор с невразумительным «Missing comment in
          # secret key», поэтому чистим сами и проверяем заранее.
          TAURI_SIGNING_PRIVATE_KEY="$(printf %s "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '[:space:]')"
          export TAURI_SIGNING_PRIVATE_KEY
          case "$TAURI_SIGNING_PRIVATE_KEY" in
            dW50cnVzdGVkIGNvbW1lbnQ6*) ;;
            *)
              echo "::error::TAURI_SIGNING_PRIVATE_KEY не похож на ключ. Нужно всё содержимое файла ~/.yeruverse/updater.key целиком — одна длинная строка base64, начинается с dW50cnVzdGVkIGNvbW1lbnQ6. Не путайте с updater.key.pub и не вставляйте расшифрованный текст ключа."
              exit 1
              ;;
          esac
          cargo tauri build

      # Установщики — людям, архивы с подписями — обновлятелю.
      - uses: actions/upload-artifact@v4
        with:
          name: yeruverse-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/**/release/bundle/**/*.dmg
            desktop/src-tauri/target/**/release/bundle/**/*.exe
            desktop/src-tauri/target/**/release/bundle/**/*.msi
            desktop/src-tauri/target/**/release/bundle/**/*.tar.gz
            desktop/src-tauri/target/**/release/bundle/**/*.zip
            desktop/src-tauri/target/**/release/bundle/**/*.sig
          if-no-files-found: warn

  android:
    name: приложение (Android)
    runs-on: ubuntu-latest
    # Секреты — на уровне задачи: в условии шага контекст `secrets` недоступен,
    # а `env` доступен, и по нему шаг подписи понимает, есть ли чем подписывать.
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      # Только arm64: все живые телефоны на нём, а Rust собирается под каждую
      # архитектуру заново — на остальных трёх ушло бы вчетверо больше времени.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y tauri-cli@^2

      - name: подготовка проекта
        run: |
          cd desktop/src-tauri && cargo tauri android init && cargo tauri icon icons/icon.png
          cd - && python3 scripts/android_patch.py

      - name: сборка APK
        working-directory: desktop/src-tauri
        run: cargo tauri android build --apk --target aarch64

      # Неподписанный APK телефон не поставит — «пакет повреждён» это про него.
      # Ключ лежит в секретах: base64 от вашего ~/.yeruverse/android.jks.
      - name: подпись APK
        if: env.ANDROID_KEYSTORE != ''
        run: |
          set -e
          echo "$ANDROID_KEYSTORE" | base64 -d > /tmp/android.jks
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)"
          raw="$(ls desktop/src-tauri/gen/android/app/build/outputs/apk/*/release/*-unsigned.apk | head -1)"
          "$tools/zipalign" -f -p 4 "$raw" yeruverse.apk
          "$tools/apksigner" sign --ks /tmp/android.jks --ks-pass "pass:$ANDROID_KEYSTORE_PASS" yeruverse.apk
          rm -f /tmp/android.jks

      - uses: actions/upload-artifact@v4
        with:
          name: yeruverse-android
          path: |
            yeruverse.apk
            desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  release:
    name: релиз по тегу
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          path: dist

      # Приложение ходит за этим файлом по постоянному адресу
      # releases/latest/download/latest.json и по нему решает, обновляться ли.
      - name: манифест обновления
        run: python3 scripts/latest_json.py --tag "${{ github.ref_name }}" --dir dist

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          # В релиз идёт только подписанный APK: неподписанный всё равно не
          # поставить, а рядом с рабочим он лишь путал бы. Подписи `.sig` тоже
          # не выкладываем — они уже внутри latest.json.
          files: |
            latest.json
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.msi
            dist/**/yeruverse.apk
            dist/**/*.tar.gz
            dist/**/*.zip
