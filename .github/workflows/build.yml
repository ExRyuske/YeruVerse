name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    name: сервер + образ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin yeruverse
      - run: cargo clippy --all-targets -- -D warnings
      - run: docker build -t yeruverse:ci .

  desktop:
    name: приложение (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # На macOS собираем универсальный пакет: один и тот же файл ставится и
          # на Apple Silicon, и на Intel — иначе пришлось бы держать две сборки.
          - os: macos-latest
            target: universal-apple-darwin
          - os: windows-latest
            target: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: cargo install tauri-cli --version "^2" --locked

      - name: сборка установщика
        working-directory: desktop/src-tauri
        # Ключ подписи обновлений — в секретах репозитория. Без него сборка
        # падает: в конфигурации есть публичный ключ, и Tauri требует приватный.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # Установщики — людям, архивы с подписями — обновлятелю.
      - uses: actions/upload-artifact@v4
        with:
          name: yeruverse-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/**/release/bundle/**/*.dmg
            desktop/src-tauri/target/**/release/bundle/**/*.exe
            desktop/src-tauri/target/**/release/bundle/**/*.msi
            desktop/src-tauri/target/**/release/bundle/**/*.tar.gz
            desktop/src-tauri/target/**/release/bundle/**/*.zip
            desktop/src-tauri/target/**/release/bundle/**/*.sig
          if-no-files-found: warn

  android:
    name: приложение (Android)
    runs-on: ubuntu-latest
    # Секреты — на уровне задачи: в условии шага контекст `secrets` недоступен,
    # а `env` доступен, и по нему шаг подписи понимает, есть ли чем подписывать.
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: cargo install tauri-cli --version "^2" --locked

      - name: подготовка проекта
        working-directory: desktop/src-tauri
        run: cargo tauri android init
      # Права, уровень языка Java и иконка — то же, что делает `make android`.
      - run: cd desktop/src-tauri && cargo tauri icon icons/icon.png
      - run: python3 scripts/android_patch.py

      - name: сборка APK
        working-directory: desktop/src-tauri
        run: cargo tauri android build --apk

      # Неподписанный APK телефон не поставит — «пакет повреждён» это про него.
      # Ключ лежит в секретах: base64 от вашего ~/.yeruverse/android.jks.
      - name: подпись APK
        if: env.ANDROID_KEYSTORE != ''
        run: |
          set -e
          echo "$ANDROID_KEYSTORE" | base64 -d > /tmp/android.jks
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)"
          raw="$(ls desktop/src-tauri/gen/android/app/build/outputs/apk/*/release/*-unsigned.apk | head -1)"
          "$tools/zipalign" -f -p 4 "$raw" yeruverse.apk
          "$tools/apksigner" sign --ks /tmp/android.jks --ks-pass "pass:$ANDROID_KEYSTORE_PASS" yeruverse.apk
          rm -f /tmp/android.jks

      - uses: actions/upload-artifact@v4
        with:
          name: yeruverse-android
          path: |
            yeruverse.apk
            desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  release:
    name: релиз по тегу
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist

      # Приложение ходит за этим файлом по постоянному адресу
      # releases/latest/download/latest.json и по нему решает, обновляться ли.
      - name: манифест обновления
        run: python3 scripts/latest_json.py --tag "${{ github.ref_name }}" --dir dist

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            latest.json
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.apk
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.sig
