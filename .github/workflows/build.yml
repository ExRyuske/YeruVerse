name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  # Фильтр по путям только здесь: у push он распространился бы и на теги, а
  # релиз, тихо не собравшийся из-за правки в документации, — худший из миров.
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Создать черновик GitHub Release после сборки.
        required: false
        default: false
        type: boolean
      release_tag:
        description: Тег релиза, который нужно собрать.
        required: false
        type: string

# Пока идёт сборка, в ветку успевают дослать ещё коммит — старый прогон уже
# никому не нужен. Релизные теги дорабатывают до конца.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # Отладочная информация в CI не нужна никому, а линковка с ней заметно дольше.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # Reusable workflow собирает именно коммит созданного релизного тега.
  BUILD_REF: ${{ inputs.release_tag || github.ref }}
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  docker:
    name: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # образ уезжает в реестр самого GitHub
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # Отдельной релизной сборки здесь нет: её делает образ ниже, а clippy
      # проверяет то же самое дерево быстрее и с предупреждениями как ошибками.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

      - uses: docker/setup-buildx-action@v4

      # В реестр пускаем только с ветки и по тегу: в PR (тем более из форка)
      # токен на запись не выдаётся, да и публиковать там нечего.
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` только с ветки по умолчанию, тег версии — с тега.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Каждая система собирается под свою архитектуру, без явного --target:
        # раннер macOS и так на Apple Silicon. Универсальный пакет компилировал
        # всё дважды — вдвое дольше ради машин, которых Apple не продаёт с 2020
        # года; Intel-маки остаются на ручной сборке.
        include:
          - { os: macos-latest, name: macOS }
          - { os: windows-latest, name: Windows }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: ./.github/actions/tauri

      - name: сборка установщика
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/build_app.sh

      # Установщики — людям, архивы с подписями — обновлятелю.
      - uses: actions/upload-artifact@v7
        with:
          name: yeruverse-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/**/release/bundle/**/*.dmg
            desktop/src-tauri/target/**/release/bundle/**/*.exe
            desktop/src-tauri/target/**/release/bundle/**/*.msi
            desktop/src-tauri/target/**/release/bundle/**/*.tar.gz
            desktop/src-tauri/target/**/release/bundle/**/*.zip
            desktop/src-tauri/target/**/release/bundle/**/*.sig
          if-no-files-found: warn

  android:
    name: Android
    runs-on: ubuntu-latest
    # Секреты — на уровне задачи: в условии шага контекст `secrets` недоступен,
    # а `env` доступен, и по нему шаг подписи понимает, есть ли чем подписывать.
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - uses: android-actions/setup-android@v4
      - name: NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      # Только arm64: все живые телефоны на нём, а Rust собирается под каждую
      # архитектуру заново — на остальных трёх ушло бы вчетверо больше времени.
      - uses: ./.github/actions/tauri
        with:
          targets: aarch64-linux-android

      - name: подготовка проекта
        run: |
          cd desktop/src-tauri && cargo tauri android init && cargo tauri icon icons/icon.png
          cd - && python3 scripts/android_patch.py

      - name: сборка APK
        working-directory: desktop/src-tauri
        run: cargo tauri android build --apk --target aarch64

      # Неподписанный APK телефон не поставит — «пакет повреждён» это про него.
      # Ключ лежит в секретах: base64 от вашего ~/.yeruverse/android.jks.
      - name: подпись APK
        if: env.ANDROID_KEYSTORE != ''
        env:
          KEYSTORE: /tmp/android.jks
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -e
          echo "$ANDROID_KEYSTORE" | base64 -d > "$KEYSTORE"
          scripts/sign_apk.sh yeruverse.apk
          rm -f "$KEYSTORE"

      - uses: actions/upload-artifact@v7
        with:
          name: yeruverse-android
          path: |
            yeruverse.apk
            desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  release:
    name: релиз по тегу
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
          # Задаче нужен один скрипт и версия приложения, с которой он сверяет тег.
          sparse-checkout: |
            scripts
            desktop/src-tauri/Cargo.toml
      - uses: actions/download-artifact@v8
        with:
          path: dist

      # Приложение ходит за этим файлом по постоянному адресу
      # releases/latest/download/latest.json и по нему решает, обновляться ли.
      - name: манифест обновления
        run: python3 scripts/latest_json.py --tag "${{ env.RELEASE_TAG }}" --dir dist

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          # В релиз идёт только подписанный APK: неподписанный всё равно не
          # поставить, а рядом с рабочим он лишь путал бы. Подписи `.sig` тоже
          # не выкладываем — они уже внутри latest.json.
          files: |
            latest.json
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.msi
            dist/**/yeruverse.apk
            dist/**/*.tar.gz
            dist/**/*.zip
