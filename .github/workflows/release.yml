name: выпуск

# Ветка `main` выпускается сама: каждый push поднимает patch-версию, ставит тег,
# собирает всё и публикует релиз. Руками — только когда нужен minor или major.
#
# Не выпускать конкретный push можно строкой `[skip release]` в сообщении
# коммита; правки одной документации не выпускаются и без неё.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".github/ISSUE_TEMPLATE/**", "LICENSE"]
  workflow_dispatch:
    inputs:
      bump:
        description: Как повысить версию перед выпуском.
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

# Нужен для коммита версии и аннотированного тега; `packages` — вызванной сборке
# образа: вызывающий workflow обязан дать не меньше прав, чем просит вызванный.
# Если main защищена, разрешите GitHub Actions обходить защиту либо запускайте
# выпуск из разрешённой ветки.
permissions:
  contents: write
  packages: write

# Пока идёт выпуск, в main успевают дослать ещё коммит. Отменять начатое нельзя:
# версия уже поднята и тег уже стоит — следующий выпуск подождёт своей очереди.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: версия и тег
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - id: version
        name: повысить версию
        run: |
          set -e
          tag="$(python3 scripts/release.py bump --part '${{ inputs.bump || 'patch' }}' | sed -n 's/.*-> \(v[0-9][0-9.]*\)$/\1/p')"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Коммит и тег уходят под токеном GitHub Actions, а его push не запускает
      # workflow заново — иначе выпуск выпускал бы сам себя по кругу.
      - name: зафиксировать версию и тег
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock desktop/src-tauri/Cargo.toml desktop/src-tauri/Cargo.lock
          git commit -m "chore(release): $TAG"
          git tag --annotate "$TAG" --message "Релиз $TAG"
          git push origin HEAD:main "$TAG"

  build:
    name: сборка и релиз
    needs: prepare
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
      packages: write
    with:
      release: true
      release_tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
