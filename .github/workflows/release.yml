name: выпуск

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Как повысить версию перед выпуском.
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

# Нужен для коммита версии и аннотированного тега. Если main защищена, разрешите
# GitHub Actions обходить защиту либо запускайте выпуск из разрешённой ветки.
permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: версия и тег
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - id: version
        name: повысить версию
        run: |
          set -e
          tag="$(python3 scripts/release.py bump --part '${{ inputs.bump }}' | sed -n 's/.*-> \(v[0-9][0-9.]*\)$/\1/p')"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: зафиксировать версию и тег
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock desktop/src-tauri/Cargo.toml desktop/src-tauri/Cargo.lock
          git commit -m "chore(release): $TAG"
          git tag --annotate "$TAG" --message "Релиз $TAG"
          git push origin HEAD:main "$TAG"

  build:
    name: сборка и черновик релиза
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      release: true
      release_tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
