name: Подготовка Tauri
description: Rust, кэш сборки и CLI Tauri — одинаково для всех сборок приложения.

inputs:
  targets:
    description: Дополнительные цели Rust через запятую.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.targets }}

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: desktop/src-tauri

    # Готовый бинарник вместо `cargo install`: тот собирал CLI из исходников по
    # несколько минут в каждой задаче.
    - uses: cargo-bins/cargo-binstall@main
    - run: cargo binstall -y tauri-cli@^2
      shell: bash
