[package]
name = "yeruverse"
version = "0.1.20"
description = "Screens, voices and keyboards shared straight between people"
repository = "https://github.com/ExRyuske/YeruVerse"
license = "GPL-3.0-or-later"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tower-http = { version = "0.7", features = ["fs"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Сборка релиза: один модуль кодогенерации и LTO дают меньший и более быстрый
# бинарник; abort вместо раскрутки стека убирает таблицы размотки.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Отладочная сборка: зависимости собираются оптимизированно (они всё равно
# компилируются один раз), свой код — быстро и с минимумом отладочной информации.
[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2
debug = false
